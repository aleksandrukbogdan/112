# Свердловская область.
# Основание: приказ Министерства общественной безопасности Свердловской области
#            от 15.02.2023 № 65 (в ред. приказа от 24.05.2023 № 126)
#
# ЧТОБЫ ДОБАВИТЬ РЕГИОН: скопируйте этот файл, поправьте значения.
# Код при этом не меняется.

kod: so
nazvanie: "Свердловская область"
okato: "65"

operator_112:
  nazvanie: "ГКУ СО «Территориальный центр мониторинга и реагирования на ЧС»"
  korotko: "ГКУ СО ТЦМ"
  uchreditel: "Министерство общественной безопасности Свердловской области"

cov:
  gorod: "Екатеринбург"
  shtat:
    vsego: 414
    cov_rcov: 22
    operatorov: 18
    edds: 154
    dds: 238
    dds_01: 58
    dds_02: 66
    dds_03: 66
    dds_04: 47
    antiterror: 1

# Подставляется в приветствие вместо {mo}
mo_shablon: "{municipalnoe_obrazovanie}"
