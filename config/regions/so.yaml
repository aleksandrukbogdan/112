# Сезонные особенности региона: лесные пожары
sezonnye_sluzhby:
  - {kod: AVIALESOOHRANA, period: "апрель–октябрь"}
  - {kod: ROSLESHOZ,      period: "апрель–октябрь"}

# Ссылки на нормативные документы региона
dokumenty:
  - {nomer: "65", data: "2023-02-15", organ: "МОБ СО", nazvanie: "Положение о системе-112"}
  - {nomer: "126", data: "2023-05-24", organ: "МОБ СО", nazvanie: "Изменения в приказ № 65"}
  - {nomer: "358-ПП", data: "2019-06-13", organ: "Правительство СО", nazvanie: "Порядок функционирования ЕДДС"}

# ЗАГЛУШКА: ожидается «Алгоритм опроса по видам происшествий» от ГКУ СО ТЦМ
algoritm_oprosa_poluchen: false
