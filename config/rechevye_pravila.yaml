# Правила речи оператора.
# Источник: методика МЧС России по оказанию психологической поддержки
#           («Психологическая поддержка», раздел для специалистов)
#
# Это официальный источник, а не мнение разработчика. В разборе вызова
# ссылаемся на методику МЧС.
istochnik: "Методика МЧС России, экстренная психологическая помощь"

trebuetsya:
  - {id: predstavitsya, opisanie: "Представиться и сказать, что готов помочь", ves: 3}
  - {id: spokoyny_ton,  opisanie: "Спокойный и уверенный голос", ves: 3}
  - {id: korotkie_frazy,opisanie: "Чёткие и короткие фразы", ves: 2}
  - {id: pobuditelnoe,  opisanie: "Побудительное наклонение", ves: 2}
  - {id: aktivnoe_slushanie, opisanie: "Приёмы активного слушания", ves: 2}

zapreshcheno:
  # 1. Частица «не» в побуждениях — методика МЧС прямо запрещает
  chastica_ne:
    ves: 2
    opisanie: "Избегать частицу «не» в побуждениях"
    obrazcy:
      - "не паникуйте"
      - "не волнуйтесь"
      - "не кричите"
      - "не переживайте"
      - "не бойтесь"
      - "не отключайтесь"
    zamena:
      "не паникуйте": "успокойтесь, слушайте меня"
      "не волнуйтесь": "я с вами, отвечайте на вопросы"
      "не кричите": "говорите спокойнее, я вас слышу"
      "не бойтесь": "я рядом, помощь уже идёт"
      "не отключайтесь": "оставайтесь на линии"

  # 2. Слова-катастрофизаторы — методика МЧС прямо запрещает
  katastrofizatory:
    ves: 3
    opisanie: "Исключить слова «паника», «катастрофа», «ужас» и подобные"
    obrazcy: [паника, паникуйте, катастрофа, ужас, ужасно, кошмар, трагедия,
              катастрофический, чудовищно, безнадёжно, всё пропало]

  # 3. Сложные конструкции
  slozhnye_frazy:
    ves: 1
    opisanie: "Не использовать сложно построенных фраз"
    max_slov_v_predlozhenii: 15

  # 4. Из критериев APCO/NENA ANS 1.107.2-2025
  neprofessionalno:
    ves: 3
    opisanie: "Без сленга, жаргона, раздражения и сарказма"
    obrazcy: [ну и что, я же сказал, вы меня не слушаете, сколько можно,
              успокойтесь уже, это не ко мне, я не обязан, перезвоните позже]

# Критерии оценки коммуникации.
# Источник: APCO/NENA ANS 1.107.2-2025, адаптировано
kriterii_ocenki:
  - {id: ton, opisanie: "Тон голоса не срывался, речь чёткая", ves: 3}
  - {id: bez_pauz, opisanie: "Не «зависал», информация вносилась немедленно", ves: 3}
  - {id: vezhlivost, opisanie: "Профессионально и вежливо", ves: 3}
  - {id: gromkost, opisanie: "Громкость соответствовала ситуации", ves: 1}
  - {id: soperezhivanie, opisanie: "Сопереживание там, где уместно", ves: 2}
  - {id: vovlechennost, opisanie: "Без скуки, сарказма и раздражения", ves: 3}
  - {id: po_imeni, opisanie: "Обращался к заявителю по имени", ves: 2}
  - {id: obyasnil_perevod, opisanie: "Объяснил причину перевода или удержания", ves: 2}
  - {id: parallelno, opisanie: "Продолжал опрос, пока вносил предыдущие данные", ves: 3}
