# Тренажёр оператора ДДС · Москва — полный стек.
#   make up        — всё: БД, приложение, голос (CPU), распознавание GigaAM (GPU)
#   make up-cpu    — без GPU: GigaAM не поднимается, распознаёт Vosk
#   make up-llm    — дополнительно поднять локальную модель в контейнере vLLM

services:
  # ---------------------------------------------------------------- база
  db:
    image: postgres:16-alpine
    container_name: t112-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: t112
      POSTGRES_USER: t112
      POSTGRES_PASSWORD: ${DB_PASSWORD:-t112pass}
    volumes:
      - ./state/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t112 -d t112"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- приложение
  app:
    build: .
    image: t112-app
    container_name: t112
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql://t112:${DB_PASSWORD:-t112pass}@db:5432/t112
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1212/v1}
      LLM_MODEL: ${LLM_MODEL:-Qwen3-VL}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      UCHEBNY_TAYMING_SEC: ${UCHEBNY_TAYMING_SEC:-30}
      VOICE_URL: http://voice:8090
      ASR_URL: http://asr:8091
      ASR_ENGINE: ${ASR_ENGINE:-auto}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:-}
      TRAINEE_PASSWORD: ${TRAINEE_PASSWORD:-}
      BACKUP_PERIOD_SEC: ${BACKUP_PERIOD_SEC:-86400}
      DDS_ETAPY_SEC: ${DDS_ETAPY_SEC:-45,25,50}
      DDS_VEROYATNOST_OSHIBKI: ${DDS_VEROYATNOST_OSHIBKI:-0.7}
    volumes:
      - ./state/app:/app/state          # ключ сессий, резервные копии
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------- голос, CPU
  # Vosk — запасное распознавание. Синтез: F5, если контейнер tts жив, иначе Piper.
  voice:
    build: ./voice
    image: t112-voice
    container_name: t112-voice
    restart: unless-stopped
    environment:
      F5_URL: ${F5_URL:-http://tts:8092}

  # ---------------------------------------------------------------- синтез F5, GPU 1
  # Карта 0 занята vLLM. Веса, звуки и голоса уже лежат на диске сервера и в git не входят.
  tts:
    profiles: ["gpu"]
    build:
      context: ./tts
      dockerfile: Dockerfile
    image: t112-f5
    container_name: t112-f5
    restart: unless-stopped
    environment:
      HF_HOME: /hf
      HUGGINGFACE_HUB_CACHE: /hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SOUND_DIR: /sounds
      VOICES_DIR: /voices
      F5_MODEL_DIR: /models/F5-TTS_RUSSIAN
      F5_CKPT: /models/F5-TTS_RUSSIAN/F5TTS_v1_Base_v4_winter/model_212000.safetensors
      F5_VOCAB: /models/F5-TTS_RUSSIAN/F5TTS_v1_Base/vocab.txt
      F5_NFE_STEP: ${F5_NFE_STEP:-12}
    volumes:
      - ${F5_MODEL_DIR:-/data/models/F5-TTS_RUSSIAN}:/models/F5-TTS_RUSSIAN:ro
      - ${F5_HF_HOME:-/data/models}:/hf:ro
      - ${F5_SOUND_DIR:-/data/112/voice/Sound}:/sounds:ro
      - ${F5_VOICES_DIR:-/data/112/voice/Voices}:/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${F5_GPU:-1}"]
              capabilities: [gpu]

  # ---------------------------------------------------------------- распознавание, GPU
  # GigaAM v3 — основной движок. Карта — ASR_GPU, НЕ та, где vLLM.
  asr:
    build: ./asr
    image: t112-asr
    container_name: t112-asr
    restart: unless-stopped
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ASR_GPU:-1}"]
              capabilities: [gpu]

  # ---------------------------------------------------------------- модель, GPU (по желанию)
  # Если vLLM у вас уже запущен на хосте — этот сервис не нужен.
  llm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: t112-llm
    restart: unless-stopped
    profiles: ["llm"]
    ipc: host
    ports:
      - "127.0.0.1:${LLM_PORT:-1212}:8000"
    volumes:
      - ${HF_CACHE:-./state/hf}:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command: >
      --model ${LLM_HF_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
      --served-model-name ${LLM_MODEL:-Qwen3-VL}
      --max-model-len ${LLM_MAX_LEN:-8192}
      --gpu-memory-utilization ${LLM_GPU_UTIL:-0.85}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLM_GPU:-0}"]
              capabilities: [gpu]
