# Тренажёр оператора 112 — полный стек.
#
# LLM (vllm-qwen на порту 1212) разворачивается ОТДЕЛЬНО и сюда не входит:
# он уже работает и занимает GPU 0.
#
# Профили:
#   по умолчанию      — postgres, api, web   (текстовый режим, поднимается за минуту)
#   --profile speech  — плюс asr и tts       (голосовой режим, первый старт долгий)

services:

  postgres:
    image: postgres:16-alpine
    container_name: t112-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-t112}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?задайте PG_PASSWORD в .env}
      POSTGRES_DB: ${PG_DB:-trainer112}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PG_PORT:-21122}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # файлы из initdb.d выполняются по алфавиту при ПЕРВОМ создании тома
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-t112} -d ${PG_DB:-trainer112}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: t112-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_PORT:-21123}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build: ./services/api
    container_name: t112-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${API_PORT:-21121}:8080"
    environment:
      DATABASE_URL: postgresql://${PG_USER:-t112}:${PG_PASSWORD}@postgres:5432/${PG_DB:-trainer112}
      ASR_URL: http://asr:8081
      TTS_URL: http://tts:8082
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1212/v1}
      LLM_MODEL: ${LLM_MODEL:-Qwen3-VL}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      ASR_ENABLED: ${ASR_ENABLED:-false}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      SCENARIOS_DIR: /content/scenarios
      CORS_ORIGINS: "*"
      # конфигурация: вся нормативка, монтируется только на чтение
      CONFIG_DIR: /config
      REGION: ${REGION:-so}
      # сессии и итоги вызовов
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSION_TTL_SEC: ${SESSION_TTL_SEC:-21600}
      ITOG_TTL_SEC: ${ITOG_TTL_SEC:-2592000}
    volumes:
      - ./content:/content:ro
      - ./config:/config:ro
    extra_hosts:
      # чтобы из контейнера достучаться до vLLM на хосте
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 60s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    image: node:20-alpine
    container_name: t112-web
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - api
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-21120}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./web:/app
      - webnode:/app/node_modules
    command: sh -c "npm install && npm run dev"
    # порт внутри контейнера всегда 3000 — наружу маппится WEB_PORT

  # ---------------- профиль speech ----------------

  asr:
    profiles: ["speech"]
    build: ./services/asr
    container_name: t112-asr
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${ASR_PORT:-21124}:8081"
    environment:
      GIGAAM_MODEL: ${GIGAAM_MODEL:-v3_e2e_rnnt}
      GIGAAM_EMO_MODEL: emo
      TORCH_HOME: /models/torch
      HF_HOME: /models/hf
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SPEECH_GPU:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  tts:
    profiles: ["speech"]
    build: ./services/tts
    container_name: t112-tts
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${TTS_PORT:-21125}:8082"
    environment:
      SILERO_MODEL_PATH: /models/silero/${SILERO_MODEL_FILE:-v4_ru.pt}
      SILERO_SPEAKER: ${SILERO_SPEAKER:-xenia}
      VOICEBANK_DIR: /voicebank
      TORCH_HOME: /models/torch
    volumes:
      - ./models:/models
      - ./voicebank:/voicebank
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  pgdata:
  redisdata:
  webnode:
